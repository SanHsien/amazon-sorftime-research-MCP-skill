[project]
name = "amazon-sorftime-research-mcp-skill"
version = "0.1.0"
description = "亞馬遜 AI 選品與運營工具集（Amazon Competitive Intelligence & Research MCP Skills）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

